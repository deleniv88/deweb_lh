# Щоденні нагадування CRM про утримання (домени, сервери) у Telegram: за 30 днів, за 7 днів і в день терміну.
# Сервер пам'ятає, що вже надіслав, тож два запуски на день (GitHub буває запізнюється) не дублюють повідомлення.
name: CRM reminders

on:
  schedule:
    - cron: "7 6 * * *"
    - cron: "37 9 * * *"
  workflow_dispatch:

concurrency:
  group: crm-reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check renewals and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          key=$(node -e 'process.stdout.write(require("crypto").createHmac("sha256", process.env.TELEGRAM_BOT_TOKEN.trim()).update("deweb-crm-cron").digest("hex"))')
          echo "::add-mask::$key"
          base=$(printf '%s' "${SITE_URL:-https://deweb.studio}" | tr -d '\r\n'); base="${base%/}"
          curl -sS --fail-with-body -X POST -H "X-CRM-Cron: $key" "$base/crm/cron.php"
