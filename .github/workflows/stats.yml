# Щоденне оновлення закритої сторінки /stats: тягне дані з Search Console, GA4 і Clarity,
# дописує їх в історію і заливає на lh.pl тільки папку stats/data (сайт не перезбирається).
# Історія живе лише на сервері: репозиторій публічний, тож статистики в ньому немає.
name: Stats

on:
  schedule:
    - cron: "0 4 * * *"   # 06:00 за Варшавою влітку, 05:00 взимку
  workflow_dispatch: {}

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # якщо історія на сервері є, вона мусить завантажитись — інакше зупиняємось, щоб не затерти її
      - name: Download current history
        run: |
          mkdir -p stats-data
          lf() { lftp -c "set ftp:ssl-allow true; set ftp:ssl-force false; set ssl:verify-certificate no; set ftp:passive-mode true; set net:timeout 30; set net:max-retries 5; set cmd:fail-exit yes; open --user \"$FTP_USERNAME\" --password \"$FTP_PASSWORD\" \"$FTP_SERVER\"; $1"; }
          list=$(lf "cls -1 \"${FTP_DIR}stats/data/\"" 2>&1) && found=1 || found=0
          if [ $found = 1 ] && echo "$list" | grep -q 'history.json'; then
            lf "get \"${FTP_DIR}stats/data/history.json\" -o stats-data/history.json"
            node -e 'JSON.parse(require("fs").readFileSync("stats-data/history.json","utf8"))' || { echo "history.json пошкоджений — зупиняюсь, щоб не затерти історію"; exit 1; }
            cp stats-data/history.json stats-data/history.prev.json
          elif [ $found = 1 ] || echo "$list" | grep -qiE '550|no such file|not found'; then
            echo "Історії ще немає — це перший запуск"
          else
            echo "$list"; echo "Не вдалося підключитися до FTP"; exit 1
          fi

      - name: Fetch GSC, GA4, Clarity
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
          GSC_SITE: https://deweb.studio/
        run: node scripts/stats/fetch.mjs stats-data/history.json

      - name: Write password config
        env:
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
        run: node scripts/stats/write-config.mjs stats-data

      - name: Upload to lh.pl
        run: |
          prev=""; [ -f stats-data/history.prev.json ] && prev="put history.prev.json"
          cat > /tmp/put.lftp <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-allow true
          set ftp:ssl-force false
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 10
          set net:reconnect-interval-base 5
          set xfer:clobber on
          open --user "$FTP_USERNAME" --password "$FTP_PASSWORD" "$FTP_SERVER"
          mkdir -p -f "${FTP_DIR}stats/data"
          cd "${FTP_DIR}stats/data"
          lcd stats-data
          put .htaccess
          put config.php
          $prev
          put history.json
          bye
          LFTP
          lftp -f /tmp/put.lftp
          rm -f /tmp/put.lftp

      # дані не мають відкриватися напряму — якщо відкриваються, workflow червоний
      - name: Check data is private
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          base="${SITE_URL:-https://deweb.studio}"; base="${base%/}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/stats/data/history.json")
          echo "history.json напряму → HTTP $code"
          [ "$code" != "200" ]
